name: Sociax Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sociax APK
    runs-on: ubuntu-latest

    steps:
      - name: Get Sociax source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: Gradle wrapper not found."
            echo "Check whether this repository contains an Android project."
            exit 1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload Sociax APK
        uses: actions/upload-artifact@v4
        with:
          name: Sociax-Android-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
